<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Mi cuenta · Doble R</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="customer-shell" data-scope="cliente" data-dashboard="/app/cliente/">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="customer-header">
    <a class="brand" href="/app/" aria-label="Doble R, inicio">
      <span class="brand-mark" aria-hidden="true">RR</span>
      <span class="brand-copy">Doble R<small>Mi espacio de personalización</small></span>
    </a>
    <nav id="menu" aria-label="Mi cuenta"></nav>
    <div class="customer-account">
      <div class="identity-block"><b id="user-name">Cargando…</b><span class="muted" id="user-role"></span></div>
      <span class="status" id="account-state"></span>
      <button id="logout" class="secondary" type="button">Salir</button>
    </div>
  </header>
  <main class="customer-main" id="contenido">
    <header class="workspace-heading"><div><p class="section-kicker">Tu cuenta Doble R</p><h1 id="view-title">Mi resumen</h1></div></header>
    <div id="content"></div>
  </main>
  <output id="notice" aria-live="polite"></output>
  <script src="../auth-session.js" defer></script>
  <script src="../dashboard.js" defer></script>
</body>
</html>
