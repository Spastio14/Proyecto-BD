<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Ventas · Doble R</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="dashboard" data-scope="ventas" data-dashboard="/app/ventas/">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <aside class="sidebar">
    <a class="brand" href="/app/" aria-label="Doble R, inicio"><span class="brand-mark" aria-hidden="true">RR</span><span class="brand-copy">Doble R<small>Ventas y atención</small></span></a>
    <nav id="menu" aria-label="Ventas"></nav>
    <footer><button id="logout" class="secondary" type="button">Cerrar sesión</button></footer>
  </aside>
  <section class="workspace">
    <header class="workspace-header"><div class="identity-block"><b id="user-name">Cargando…</b><span class="muted" id="user-role"></span></div><span class="status" id="account-state"></span></header>
    <main id="contenido"><header class="workspace-heading"><p class="section-kicker">Ventas y atención</p><h1 id="view-title">Pedidos</h1></header><div id="content"></div></main>
  </section>
  <output id="notice" aria-live="polite"></output>
  <script src="../auth-session.js" defer></script>
  <script src="../dashboard.js" defer></script>
</body>
</html>
